# BC Glass & Tint: content editor configuration (Sveltia CMS).
# Maps the visual editor onto the site's content files. The shop office edits
# friendly fields here; the CMS commits the changes straight back to
# _data/site.json and the per-page files under _data/pages/, and Netlify
# rebuilds the live site from that commit.
#
# Repo: this site lives on the studio's own GitHub account, 1BIGRED/bc-glass-and-tint-site.
# Login is GitHub OAuth through Netlify's built-in OAuth client, a GitHub
# OAuth app registered on 1BIGRED and installed in the shop's own Netlify
# under Project configuration > Security > OAuth. There is no base_url on
# purpose; leaving it out is what tells Sveltia to sign in through Netlify
# instead of a separate auth server.
#
# Every save here is a commit to the main branch, and Netlify rebuilds the
# live site from that commit automatically. While the repo stays private,
# only one GitHub account can commit to it on Netlify's free plan, so only
# one person edits at a time for now. See SVELTIA-SWITCH-CHECKLIST.md in
# 09 - Website for the plan to open that up later.
#
# _data/frame.json is NOT in this file, on purpose. It holds per-page layout
# switches (which header style, which CSS blocks, which icon set load) that
# keep each page's HTML structure correct. It is a studio-only file; editing
# it through the CMS could break a page's layout, so the office never sees
# it here and never needs to. The same goes for the other studio-only data files:
# _data/images.json and _data/v2images.json (written by the image pipeline) and
# _data/banned.json (the list of phrases the build refuses to publish).
#
# Safety net (WS7, overhaul v3): this file carries `required` and `pattern` checks
# (phone, hours, dates, tracking ids), the tracking ids live in the hidden Studio Only
# collection, and the build refuses a bad value even if one got past the editor.
# Scripts\Test-CmsConfig.ps1 (in 09 - Website) compares every field path here with
# the real keys in _data and must report 0 orphans either way before a deploy.

backend:
  name: github
  repo: 1BIGRED/bc-glass-and-tint-site
  branch: main

site_url: https://bcglassandtint.com
display_url: https://bcglassandtint.com
publish_mode: simple

# Where an uploaded photo is stored.
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # ================================================================
  # Business info and review counts (one editable document).
  # ================================================================
  - name: business
    label: "Business Info & Review Counts"
    delete: false
    editor:
      preview: false
    files:
      - name: site
        label: "Business Info & Review Counts"
        file: "_data/site.json"
        description: "The facts that print on every page: name, phone, address, hours, social links and review counts. A change here changes every page at once."
        fields:
          - { label: "Business name", name: name, widget: string }
          - { label: "Business name (page source form)", name: name_html, widget: string, hint: "The same name written the way it has to appear in the page's HTML, with &amp; for the ampersand. Keep it matching Business name above, just with &amp; instead of &." }
          - { label: "Other accepted name", name: alternate_name, widget: string, hint: "A second accepted spelling of the business name, read by search engines." }
          - { label: "Website address", name: url, widget: string, hint: "Technical. Ask the studio before changing." }
          - { label: "Website origin", name: origin, widget: string, hint: "Technical. Ask the studio before changing." }
          - { label: "Logo address", name: logo, widget: string, hint: "Technical. Ask the studio before changing." }
          - { label: "Year founded", name: founding_year, widget: string }
          - { label: "Business description for search engines", name: description, widget: text, hint: "Shown to search engines, not usually seen by customers. Changes every page and the Google listing data. Check with the studio first. May contain a token like {google_count} or {google_rating}; these are filled in automatically from the Review counts and ratings fields below, leave them exactly as they are." }
          - label: "Phone"
            name: phone
            widget: object
            hint: "Changes every page and the Google listing data. Check with the studio first."
            fields:
              - { label: "As printed", name: display, widget: string, required: true, pattern: ['^\d{3}-\d{3}-\d{4}$', "Write the number as 702-550-8840: three digits, a dash, three digits, a dash, four digits."], hint: "For example 702-550-8840. The number is checked when you press Save; a number in the wrong shape cannot be saved." }
              - { label: "Dialing form (tel: link)", name: tel, widget: string, required: true, pattern: ['^\+1\d{10}$', "Write a plus sign, the 1, then the ten digits with no spaces, dashes or brackets, for example +17025508840."], hint: "Technical format for click-to-call links: a plus sign, the country code 1, then the ten digits with no spaces or dashes, for example +17025508840. A number in any other shape is refused when you press Save, so a bad number is stopped before it is saved." }
              - { label: "Search engine form", name: schema, widget: string, required: true, pattern: ['^\+1-\d{3}-\d{3}-\d{4}$', "Write the number as +1-702-550-8840."], hint: "Technical format read by search engines, for example +1-702-550-8840. It must be the same number as the dialing form." }
              - { label: "As printed on call buttons", name: display_call, widget: string, required: true, pattern: ['^\(\d{3}\) \d{3}-\d{4}$', "Write the number as (702) 550-8840, with the area code in brackets."], hint: "The same number written with the area code in parentheses, for example (702) 550-8840. It must be the same number as As printed above." }
          - { label: "Public email", name: email, widget: string, hint: "Changes every page and the Google listing data. Check with the studio first." }
          - label: "Address"
            name: address
            widget: object
            hint: "Changes every page and the Google listing data. Check with the studio first."
            fields:
              - { label: "Street", name: street, widget: string }
              - { label: "City", name: city, widget: string }
              - { label: "State", name: region, widget: string }
              - { label: "ZIP code", name: postal_code, widget: string }
              - { label: "Country", name: country, widget: string }
              - { label: "One line, as printed", name: display, widget: string }
          - label: "Map position"
            name: geo
            widget: object
            hint: "Changes every page and the Google listing data. Check with the studio first."
            fields:
              - { label: "Latitude", name: latitude, widget: string }
              - { label: "Longitude", name: longitude, widget: string }
          - label: "Hours"
            name: hours
            widget: object
            hint: "Changes every page and the Google listing data. Check with the studio first."
            fields:
              - { label: "As printed", name: display, widget: string, required: true, hint: "How the hours read on the page, for example Tuesday to Saturday, 9am to 5pm." }
              - { label: "Search engine form", name: schema, widget: string, required: true, hint: "Technical format, for example Tu-Sa 09:00-17:00. Ask the studio before changing." }
              - label: "Open days"
                name: days
                widget: list
                label_singular: "Day"
                summary: "{{fields.value}}"
                field: { label: "Day", name: value, widget: string }
              - { label: "Opens", name: opens, widget: string, required: true, pattern: ['^([01]\d|2[0-3]):[0-5]\d$', "Write the time in 24-hour form, for example 09:00."], hint: "24-hour time, for example 09:00." }
              - { label: "Closes", name: closes, widget: string, required: true, pattern: ['^([01]\d|2[0-3]):[0-5]\d$', "Write the time in 24-hour form, for example 17:00."], hint: "24-hour time, for example 17:00." }
              - { label: "Time zone", name: timezone, widget: string, hint: "Technical. The open and closed message works out the time in this zone. Ask the studio before changing." }
          - label: "Holiday closures (shop closed all day)"
            name: closures
            widget: list
            label_singular: "Closed day"
            required: false
            summary: "{{fields.date}} {{fields.reason}}"
            hint: "Add a day the shop is closed all day, only once the shop has confirmed it. On that date the site says the shop is closed and shows the next day it opens. Pick the date, then type the reason as a short name, because the site prints it: Closed for Thanksgiving. Past dates can stay; the site ignores them. A date cannot be in this list and in Holidays with hours not confirmed at the same time. A date or reason left empty stops the save."
            fields:
              - { label: "Date", name: date, widget: datetime, type: date, required: true, pattern: ['^\d{4}-\d{2}-\d{2}$', "Pick the day with the date picker. It must be a real date written like 2026-11-26."], hint: "Pick the calendar day." }
              - { label: "Reason (printed on the site)", name: reason, widget: string, required: true, hint: "A short name for the closure, written to follow the words Closed for. Examples: Thanksgiving, Christmas Eve, the day after Christmas." }
          - label: "Holidays with hours not confirmed"
            name: hours_unknown
            widget: list
            label_singular: "Day"
            required: false
            summary: "{{fields.date}} {{fields.note}}"
            hint: "Days when the shop has not confirmed its hours. On these dates the site shows no open or closed message at all, so it never says something wrong. When the shop confirms a day, delete it from this list. If the shop is closed that day, add it to Holiday closures. If the shop is open its normal hours, just delete it. A date cannot be in this list and in Holiday closures at the same time."
            fields:
              - { label: "Date", name: date, widget: datetime, type: date, required: true, pattern: ['^\d{4}-\d{2}-\d{2}$', "Pick the day with the date picker. It must be a real date written like 2027-01-01."], hint: "Pick the calendar day." }
              - { label: "Note", name: note, widget: string, required: false, hint: "For your own reference, for example Christmas Eve, hours not confirmed. The site does not print this note on the page." }
          # Not read by any template yet and its shape is not settled, so it stays studio only.
          - { label: "Per-day notes (studio only)", name: day_notes, widget: hidden }
          - { label: "Where the hours came from (studio only)", name: hours_source, widget: hidden }
          - { label: "The shop answers texts (owner confirmed)", name: texts_confirmed, widget: boolean, default: false, required: false, hint: "Leave this OFF until the owner has said the shop reads and answers texts. While it is off, the site offers Request a time as the main button when the shop is closed. Turn it on and the site offers Text us instead. Save, and the site updates after the rebuild." }
          - { label: "The shop can assess a chip from a photo (owner confirmed)", name: chip_photo_assess, widget: boolean, default: false, required: false, hint: "Leave this OFF until the owner has said the shop can look at a photo of a chip and say whether it can be repaired." }
          - label: "Lines the site shows once the owner confirms them"
            name: lines
            widget: object
            hint: "Leave each line empty until the owner has confirmed exactly what the shop does. An empty line is not shown on the site."
            fields:
              - { label: "Reply time to a text", name: text_reply, widget: string, required: false, hint: "One short sentence, only after the owner confirms how fast texts are answered." }
              - { label: "When a request gets confirmed", name: request_confirm, widget: string, required: false, hint: "One short sentence, only after the owner confirms how fast a booking request is answered." }
              - { label: "How long a call takes", name: call_length, widget: string, required: false, hint: "One short sentence, only after the owner confirms it." }
          - { label: "Google Maps link", name: maps_url, widget: string, hint: "Changes every page and the Google listing data. Check with the studio first." }
          - { label: "Payment accepted", name: payment_accepted, widget: string, hint: "Plain text list read by search engines, for example Cash, Credit Card, Debit Card." }
          - label: "Areas served (search engines)"
            name: area_served
            widget: list
            label_singular: "Area"
            summary: "{{fields.name}}"
            hint: "Not shown on the page. Read by search engines. Ask the studio before changing."
            fields:
              - { label: "Kind", name: type, widget: string, hint: "Technical: City, Place or AdministrativeArea. Ask the studio before changing." }
              - { label: "Name", name: name, widget: string }
              - { label: "State", name: region, widget: string, required: false }
          - label: "Photos for search engines"
            name: schema_images
            widget: list
            label_singular: "Photo address"
            summary: "{{fields.value}}"
            hint: "Technical image addresses read by search engines. Ask the studio before changing."
            field: { label: "Photo address", name: value, widget: string }
          - label: "Social links"
            name: social
            widget: object
            fields:
              - { label: "Instagram", name: instagram, widget: string, hint: "Only @bc.glassandtint. Never the old @bcglassandtint handle." }
              - { label: "Facebook", name: facebook, widget: string }
              - { label: "Yelp", name: yelp, widget: string }
              - { label: "Tint Wiz", name: tintwiz, widget: string }
              - { label: "Nextdoor", name: nextdoor, widget: string }
              - { label: "TintFinder", name: tintfinder, widget: string }
          - label: "Profiles listed for search engines"
            name: same_as
            widget: list
            label_singular: "Profile address"
            summary: "{{fields.value}}"
            hint: "Every profile address search engines are told belongs to this business. The Instagram entry must stay @bc.glassandtint. Never the old @bcglassandtint handle. Ask the studio before changing or reordering these."
            field: { label: "Profile address", name: value, widget: string }
          - label: "Review counts and ratings"
            name: reviews
            widget: object
            hint: "Re-read the live Google, Yelp and Tint Wiz listings before changing any number here. Every page fills these in automatically."
            fields:
              - { label: "Google rating", name: google_rating, widget: string, hint: "Re-read the live Google listing before changing this. It prints on every page." }
              - { label: "Google review count", name: google_count, widget: string, hint: "Re-read the live Google listing before changing this. It prints on every page." }
              - { label: "Yelp rating", name: yelp_rating, widget: string, hint: "Re-read the live Yelp listing before changing this. It prints on every page." }
              - { label: "Yelp review count", name: yelp_count, widget: string, hint: "Re-read the live Yelp listing before changing this. It prints on every page." }
              - { label: "Tint Wiz rating", name: tintwiz_rating, widget: string, hint: "Re-read the live Tint Wiz listing before changing this. It prints on every page." }
              - { label: "Tint Wiz review count", name: tintwiz_count, widget: string, hint: "Re-read the live Tint Wiz listing before changing this. It prints on every page." }
          # The analytics ids and the Google verification token are kept here as hidden
          # fields only, so a save from this page carries them through untouched. They
          # are edited in the Studio Only collection, which is hidden from the menu.
          - { label: "Google Analytics id (studio only)", name: ga4_id, widget: hidden }
          - { label: "Google Ads tag ID (studio only)", name: google_ads_id, widget: hidden }
          - { label: "Microsoft Clarity id (studio only)", name: clarity_id, widget: hidden }
          - { label: "Google site verification token (studio only)", name: google_site_verification, widget: hidden }

  # ================================================================
  # Studio only: tracking ids and the Google verification token.
  # The same file as Business Info (_data/site.json), shown on its own and hidden
  # from the menu (hide: true) so the office never sees these four values. Only
  # the studio opens it, by adding #/collections/studio_only to the editor address.
  # This hides it; it does not lock it. The real lock is who can sign in to the
  # repo. Every other key of the file is listed here as hidden so a save from this
  # page carries the rest of the file through untouched.
  # ================================================================
  - name: studio_only
    label: "Studio Only (tracking ids)"
    delete: false
    hide: true
    editor:
      preview: false
    files:
      - name: site_ids
        label: "Tracking ids and verification token"
        file: "_data/site.json"
        description: "Studio only. Do not change these without the studio. A wrong id stops visitor counting or the Google ownership check. Each value is checked for its shape when you press Save."
        fields:
          - { label: "Google Analytics id", name: ga4_id, widget: string, required: true, pattern: ['^G-[A-Z0-9]+$', "A Google Analytics id starts with G- followed by capital letters and digits, for example G-ABC123XYZ4."], hint: "Starts with G- followed by capital letters and digits." }
          - { label: "Google Ads tag ID", name: google_ads_id, widget: string, required: false, pattern: ['^AW-\d+$', "A Google Ads tag id is AW- followed by digits, for example AW-1234567890."], hint: "AW- followed by digits. Leave empty and no Ads tag loads." }
          - { label: "Microsoft Clarity id", name: clarity_id, widget: string, required: true, pattern: ['^[a-z0-9]{8,12}$', "A Clarity id is 8 to 12 lowercase letters and digits."], hint: "8 to 12 lowercase letters and digits." }
          - { label: "Google site verification token", name: google_site_verification, widget: string, required: true, hint: "The ownership token Google gave for the site. Keep it in place permanently." }
          # Everything else in the file, kept as hidden so a save does not drop it.
          - { label: "name", name: name, widget: hidden }
          - { label: "name_html", name: name_html, widget: hidden }
          - { label: "alternate_name", name: alternate_name, widget: hidden }
          - { label: "url", name: url, widget: hidden }
          - { label: "origin", name: origin, widget: hidden }
          - { label: "logo", name: logo, widget: hidden }
          - { label: "founding_year", name: founding_year, widget: hidden }
          - { label: "description", name: description, widget: hidden }
          - { label: "phone", name: phone, widget: hidden }
          - { label: "email", name: email, widget: hidden }
          - { label: "address", name: address, widget: hidden }
          - { label: "geo", name: geo, widget: hidden }
          - { label: "hours", name: hours, widget: hidden }
          - { label: "closures", name: closures, widget: hidden }
          - { label: "hours_unknown", name: hours_unknown, widget: hidden }
          - { label: "day_notes", name: day_notes, widget: hidden }
          - { label: "hours_source", name: hours_source, widget: hidden }
          - { label: "texts_confirmed", name: texts_confirmed, widget: hidden }
          - { label: "chip_photo_assess", name: chip_photo_assess, widget: hidden }
          - { label: "lines", name: lines, widget: hidden }
          - { label: "maps_url", name: maps_url, widget: hidden }
          - { label: "payment_accepted", name: payment_accepted, widget: hidden }
          - { label: "area_served", name: area_served, widget: hidden }
          - { label: "schema_images", name: schema_images, widget: hidden }
          - { label: "social", name: social, widget: hidden }
          - { label: "same_as", name: same_as, widget: hidden }
          - { label: "reviews", name: reviews, widget: hidden }

  # ================================================================
  # Prices and gallery photos (_data/pricing.json, _data/gallery.json).
  # A price reaches the public site only through the rule in lib/pricing.js:
  # status confirmed AND publish on AND not on legal hold. The gallery lists
  # only photos that were checked for faces and personal items.
  # ================================================================
  - name: prices_gallery
    label: "Prices & Gallery Photos"
    delete: false
    editor:
      preview: false
    files:
      - name: pricing
        label: "Prices"
        file: "_data/pricing.json"
        description: "Every price the website can show. Only a price the owner has confirmed may be published: a price shows on the live site only when Status is Confirmed AND Show on the live site is on. Everything else shows Call for a quote. Draft prices never show on the live site. Never type a guess, a competitor's number, or 0 to mean unknown. The lines on legal hold are locked and cannot be switched on here."
        fields:
          - { label: "Date last updated", name: updated, widget: string, required: true, pattern: ['^\d{4}-\d{2}-\d{2}$', "Write the date as year-month-day, for example 2026-11-02."], hint: "Year-month-day, for example 2026-11-02. Change it to today's date whenever you change a price." }
          - { label: "Currency", name: currency, widget: string, hint: "Do not change." }
          - { label: "Prices last reviewed with the owner", name: reviewed_on, widget: datetime, type: date, required: false, pattern: ['^\d{4}-\d{2}-\d{2}$', "Pick the day with the date picker. It must be a real date written like 2026-11-02."], hint: "The day the whole price list was last checked with the owner. The Prices page prints Prices reviewed on this date. Leave it empty until that check has happened." }
          - { label: "Lowest legal shade for front doors (studio only)", name: front_min_vlt, widget: hidden }
          - { label: "Where that limit comes from (studio only)", name: front_min_vlt_source, widget: hidden }
          - label: "Starting points in Build Your Tint (presets)"
            name: presets
            widget: list
            label_singular: "Starting point"
            summary: "{{fields.label}} ({{fields.status}})"
            hint: "The ready-made choices a visitor can pick first. A starting point shows on the live site only when its Status is Confirmed AND Show on the live site is on, the same rule as a price. Only a starting point the owner has confirmed may be switched on. Drafts show on the test copy of the site only."
            fields:
              - { label: "Id (studio only)", name: id, widget: string, hint: "Technical. Ask the studio before changing." }
              - { label: "Name shown to visitors", name: label, widget: string, required: true }
              - { label: "One line that explains it", name: description, widget: text, required: false }
              - { label: "Windows and shades (studio only)", name: panels, widget: hidden }
              - label: "Status"
                name: status
                widget: select
                required: true
                options:
                  - { label: "Unknown, not decided yet", value: unknown }
                  - { label: "Draft, not signed off by the owner", value: draft }
                  - { label: "Confirmed, the owner approved this starting point", value: confirmed }
                hint: "Pick Confirmed only after the owner has approved this exact starting point, shades included."
              - { label: "Show on the live site", name: publish, widget: boolean, default: false, required: false, hint: "Only a starting point the owner has confirmed may be switched on. Leave this off and the visitor does not see it on the live site." }
              - { label: "Where it came from (studio only)", name: source, widget: string, required: false, hint: "Reference only. Do not change." }
          - { label: "Starting point chosen for the visitor (studio only)", name: default_preset, widget: string, required: false, hint: "Technical. Leave empty so no starting point is pre-selected. Ask the studio before changing." }
          - label: "Add-ons offered with a price"
            name: addons
            widget: list
            label_singular: "Add-on"
            summary: "{{fields.label}}"
            hint: "Each add-on is priced from the price line it points to. It is offered with a price only when that price is Confirmed AND Show on the live site is on; otherwise the site says Call for a quote."
            fields:
              - { label: "Id (studio only)", name: id, widget: string, hint: "Technical. Ask the studio before changing." }
              - { label: "Name shown to visitors", name: label, widget: string, required: true }
              - { label: "What it does for the customer", name: benefit, widget: string, required: false, hint: "One plain sentence. Leave empty until the owner has said what to promise." }
              - { label: "Price line it uses (studio only)", name: price_ref, widget: string, hint: "Technical. Names the price in the lists below. Ask the studio before changing." }
          - label: "Add-ons to ask about (no price on the site)"
            name: also_ask
            widget: list
            label_singular: "Add-on"
            summary: "{{fields.label}}"
            hint: "Shown as a question to ask when the shop confirms the booking. No price is printed for these."
            fields:
              - { label: "Id (studio only)", name: id, widget: string, hint: "Technical. Ask the studio before changing." }
              - { label: "Name shown to visitors", name: label, widget: string, required: true }
              - { label: "What it does for the customer", name: benefit, widget: string, required: false, hint: "One plain sentence. Leave empty until the owner has said what to promise." }
          - label: "Rules, in plain English (read only, do not edit)"
            name: notes
            widget: list
            label_singular: "Rule"
            summary: "{{fields.value}}"
            hint: "The studio's notes on how this file works. Read them, but do not edit them."
            field: { label: "Rule", name: value, widget: text }
          - { label: "Price gate (studio only)", name: gate, widget: hidden }
          - { label: "Film lines (studio only)", name: film_tiers, widget: hidden }
          - label: "Shades the shop stocks"
            name: shades_installed
            widget: list
            label_singular: "Shade"
            required: false
            summary: "{{fields.value}}"
            hint: "Add a shade (the percent of light the film lets through) only when the owner lists it as stocked. While this list is empty, the Build Your Tint tool shows example shades with a note that the shop confirms what it stocks."
            field: { label: "Shade (percent of light let through)", name: value, widget: number, value_type: int, min: 1, max: 100 }
          - { label: "Example shades (studio only)", name: example_shades, widget: hidden }
          - { label: "Vehicle sizes (studio only)", name: vehicle_classes, widget: hidden }
          - label: "Single-price lines (chip repair, home film, coatings, blinds)"
            name: services
            widget: object
            hint: "One price each. A price shows on the live site only when Status is Confirmed AND Show on the live site is on."
            fields:
              - label: "Windshield chip repair, first chip"
                name: chip_repair_first
                widget: object
                collapsed: true
                summary: "{{fields.status}} {{fields.display}}"
                fields: &service_fields
                  - { label: "Name of this line", name: label, widget: string, hint: "Technical name of the price line. Ask the studio before changing." }
                  - { label: "Unit", name: unit, widget: string, required: false, hint: "What the price is for, for example per square foot. Ask the studio before changing." }
                  - label: "Status"
                    name: status
                    widget: select
                    required: true
                    options:
                      - { label: "Unknown, no number yet", value: unknown }
                      - { label: "Draft, not signed off by the owner", value: draft }
                      - { label: "Confirmed, the owner gave this exact number", value: confirmed }
                    hint: "A price shows on the live site only when status is confirmed AND Show on the live site is on. Pick Confirmed only after the owner has given this exact number."
                  - { label: "Amount (number only)", name: amount, widget: number, value_type: float, min: 0, required: false, hint: "A plain number with no dollar sign, for example 80. Leave empty if unknown. Never type 0 to mean unknown. Never type a guess or a competitor's number." }
                  - { label: "Words the site prints", name: display, widget: string, required: false, hint: "Exactly what customers read, for example $80 or From $350. Fill it in when the status is Confirmed. Keep Starting at wording where the line says it." }
                  - { label: "Show on the live site", name: publish, widget: boolean, default: false, required: false, hint: "A price shows on the live site only when status is confirmed AND Show on the live site is on. Only a price the owner has confirmed may be switched on. Leave this off to keep a confirmed price private; the site then says Call for a quote." }
