      - name: build_your_tint
        label: "Build Your Tint Page (wording only)"
        file: "_data/pages/build_your_tint.json"
        description: "The wording of the Build Your Tint tool. Prices come from Prices & Gallery Photos, Prices, never from this page. Wording may contain small HTML codes or tags, such as &amp;, and tokens in braces, such as {n}. Keep them exactly as they are."
        fields:
          - label: "Search result listing"
            name: meta
            widget: object
            fields:
              - { label: "Title", name: title, widget: string, hint: "Keep the &amp; entity as it is." }
