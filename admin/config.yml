  # ================================================================
  # Customer reviews: which ones the site may quote (_data/reviews.json).
  # The site prints a review only when Platform is Google AND the quote switch is
  # on (featurable) AND the review has text. The build refuses to print any Yelp
  # wording at all. The flags and the re-read date are records for people: the build
  # does not read them, so the quote switch is the only control.
  # ================================================================
  - name: reviews_pool
    label: "Customer Reviews (which ones the site may quote)"
    delete: false
    editor:
      preview: false
    files:
      - name: reviews
        label: "Customer Reviews"
        file: "_data/reviews.json"
        description: "The pool of real customer reviews. The site quotes a review only when it is a Google review AND the switch Site may quote this review is on. Every review is word for word from the live Google listing; never retype, shorten, join or invent one. Yelp wording never goes on the site, so Yelp entries keep an empty Review text on purpose."
        fields:
          - { label: "Note for the studio (read only)", name: _note, widget: hidden }
          - { label: "Google listing address (studio only)", name: listing_url, widget: hidden }
          - { label: "Yelp listing address (studio only)", name: yelp_url, widget: hidden }
          - label: "Reviews"
            name: items
            widget: list
            label_singular: "Review"
            summary: "{{fields.author_display}} ({{fields.platform}})"
            hint: "Add a review only after reading it on the live listing. Turn on Site may quote this review only for a Google review that was re-read there, has no problem flag, and says nothing the shop cannot stand behind."
            fields:
              - { label: "Review id", name: id, widget: string, required: true, pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Use lowercase letters, digits and single dashes only, for example g-first-last."], hint: "Short name with dashes and no spaces, for example g-first-last (g for Google, y for Yelp). Different from every other review. Do not change it later." }
              - label: "Platform"
                name: platform
                widget: select
                required: true
                options:
                  - { label: "Google", value: google }
                  - { label: "Yelp", value: yelp }
                hint: "Where the review was written. Only Google reviews can be quoted on the site."
              - { label: "Reviewer name, exactly as the platform shows it", name: author_display, widget: string, required: true, hint: "Copy it exactly as it shows on the listing." }
              - { label: "Month and year of the review", name: month_year, widget: string, required: false, pattern: ['^\d{4}-(0[1-9]|1[0-2])$', "Write the month as year-month, for example 2026-08."], hint: "Year-month, for example 2026-08. Leave empty if you have not read it on the listing." }
              - { label: "Link to the review or the listing", name: url, widget: string, required: false, hint: "Leave empty if you do not have it." }
              - { label: "Review text (word for word)", name: text, widget: text, required: false, hint: "Required for a Google review: copy the words exactly, no edits. Leave EMPTY for a Yelp review on purpose, because Yelp wording never goes on the site." }
              - label: "Jobs this review fits"
                name: services
                widget: select
                multiple: true
                required: false
                options:
                  - { label: "Auto tint", value: car }
                  - { label: "Home window film", value: home }
                  - { label: "Blinds", value: blinds }
                  - { label: "Windshield chip repair", value: chip }
                  - { label: "Windshield glass", value: windshield }
                  - { label: "Commercial and office film", value: commercial }
                  - { label: "Ceramic coating", value: ceramic }
                  - { label: "Clear bra, paint protection film", value: clearbra }
                  - { label: "Any job", value: general }
                hint: "Where the site may show this review. Pick every job the review is truly about."
              - { label: "Site may quote this review", name: featurable, widget: boolean, default: false, required: false, hint: "OFF means the site never quotes it. Turn it ON only for a Google review that was re-read on the live Google listing and has no problem flag below. Yelp reviews stay OFF." }
              - label: "Problem flags"
                name: flags
                widget: select
                multiple: true
                required: false
                options:
                  - { label: "Compares us with another shop (comparative)", value: comparative }
                  - { label: "Names a person at the shop (names_owner)", value: names_owner }
                  - { label: "Says we did the windshield replacement ourselves (replacement_labour)", value: replacement_labour }
                  - { label: "Joins pieces from different places (spliced)", value: spliced }
                  - { label: "Mentions full windshield film (full_windshield)", value: full_windshield }
                hint: "A flag is a warning for people, and the quote switch is what decides. Never turn the quote switch on for a flagged review. Windshield replacement is done by a partner shop, never by us."
              - { label: "Date it was re-read on the live listing", name: verified_on, widget: datetime, type: date, required: false, pattern: ['^\d{4}-\d{2}-\d{2}$', "Pick the day with the date picker. It must be a real date written like 2026-11-02."], hint: "The day someone re-read this review on the live Google listing. Fill it in when you turn the quote switch on, so the record shows when it was last checked." }
              - { label: "Re-read by", name: verified_by, widget: string, required: false, hint: "A role, such as the office. No personal names on the site; this is not printed." }
              - { label: "Why it is on or off", name: reason, widget: text, required: false, hint: "A short note for the office and studio. Not printed on the page." }
              - { label: "Where the wording came from (studio only)", name: source, widget: string, required: false, hint: "Reference only. Do not change." }

  # ================================================================
  # Shared wording: header, footer, quote form, cookie banner.
