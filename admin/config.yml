  # ================================================================
  # Homepage
  # ================================================================
  - name: homepage
    label: "Homepage"
    delete: false
    editor:
      preview: false
    files:
      - name: home
        label: "Homepage"
        file: "_data/pages/home.json"
        description: "Wording may contain small HTML codes or tags, such as &amp; or <span>, and tokens like {google_count}. Keep them exactly as they are; the tokens are filled in automatically from Business Info & Review Counts."
        fields:
          - label: "Search result listing"
            name: meta
            widget: object
            fields:
              - { label: "Title", name: title, widget: string, hint: "The blue link in Google results." }
              - { label: "Description", name: description, widget: text, hint: "The grey text under the link in Google." }
              - { label: "Hero photo description (for screen readers)", name: image_alt, widget: string }
          - label: "Search engine details (advanced)"
            name: schema
            widget: object
            hint: "Not shown on the page. Read by Google. Ask the studio before changing."
            fields:
              - { label: "Date last modified", name: date_modified, widget: string, required: true, pattern: ['^\d{4}-\d{2}-\d{2}$', "Write the date as year-month-day, for example 2026-11-02."], hint: "Year-month-day, for example 2026-11-02." }
              - label: "Service catalog"
                name: offer_catalog
                widget: object
                fields:
                  - { label: "Catalog name", name: name, widget: string }
                  - label: "Areas served"
                    name: area_served
                    widget: list
                    label_singular: "Area"
                    summary: "{{fields.value}}"
                    field: { label: "Area", name: value, widget: string }
                  - label: "Catalog items"
                    name: items
                    widget: list
                    label_singular: "Item"
                    summary: "{{fields.name}}"
                    fields:
                      - { label: "Name", name: name, widget: string }
                      - { label: "Page path", name: path, widget: string, hint: "Technical. Ask the studio before changing." }
                      - { label: "Id suffix", name: id_suffix, widget: string, required: false, hint: "Technical. Ask the studio before changing." }
          - label: "Page wording (new design)"
            name: v3
            widget: object
            hint: "Wording for the new design. Words in braces, such as {google_count}, are filled in automatically; leave them exactly as they are. Prices are never typed here: they come from Prices."
            fields:
              - label: "Hero"
                name: hero
                widget: object
                fields:
                  - { label: "Small line above the heading", name: eyebrow, widget: string }
                  - { label: "Main heading", name: h1, widget: string }
                  - { label: "Paragraph", name: sub, widget: string }
                  - { label: "Router label", name: router_label, widget: string }
                  - { label: "Proof line", name: proof, widget: string }
                  - { label: "Media mode", name: media_mode, widget: string, hint: "Technical. Ask the studio before changing." }
                  - { label: "Photo image", name: photo_image, widget: string, hint: "Technical. Ask the studio before changing." }
                  - { label: "Media note", name: media_note, widget: string }
                  - { label: "Storefront photo", name: storefront_photo, widget: string }
              - label: "Router"
                name: router
                widget: list
                label_singular: "Item"
                summary: "{{fields.label}}"
                fields:
                  - { label: "Id", name: id, widget: string, hint: "Technical. Ask the studio before changing." }
                  - { label: "Label", name: label, widget: string }
                  - { label: "Link address", name: href, widget: string, hint: "Technical. Ask the studio before changing." }
                  - { label: "Price source (studio only)", name: price_ref, widget: string, required: false, hint: "Technical. Ask the studio before changing." }
                  - { label: "Price wording template", name: price_tpl, widget: string, required: false, hint: "Words in braces, such as {google_count}, are filled in automatically. Leave them exactly as they are." }
                  - { label: "Fallback", name: fallback, widget: string, required: false }
                  - { label: "Micro", name: micro, widget: string, required: false }
              - label: "Wording ids (studio only)"
                name: words_ids
                widget: list
                label_singular: "Item"
                summary: "{{fields.value}}"
                field: { label: "Item", name: value, widget: string }
              - label: "Questions and answers"
                name: faq
                widget: object
                fields:
                  - label: "Items"
                    name: items
                    widget: list
                    label_singular: "Item"
                    summary: "{{fields.question}}"
                    fields:
                      - { label: "Question", name: question, widget: string }
                      - { label: "Answer", name: answer, widget: text, hint: "Keep any HTML codes, such as &amp; and tags, exactly as they are." }
          - { label: "Note (studio only)", name: _note, widget: hidden }

