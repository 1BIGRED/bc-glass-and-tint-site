# BC Glass & Tint: content editor configuration (Sveltia CMS).
# Maps the visual editor onto the site's content files. The shop office edits
# friendly fields here; the CMS commits the changes straight back to
# _data/site.json and the per-page files under _data/pages/, and Netlify
# rebuilds the live site from that commit.
#
# Repo: this site lives on Chase's own GitHub, 1BIGRED/bc-glass-and-tint-site.
# Login is GitHub OAuth through Netlify's built-in OAuth client, a GitHub
# OAuth app registered on 1BIGRED and installed in the shop's own Netlify
# under Project configuration > Security > OAuth. There is no base_url on
# purpose; leaving it out is what tells Sveltia to sign in through Netlify
# instead of a separate auth server.
#
# Every save here is a commit to the main branch, and Netlify rebuilds the
# live site from that commit automatically. While the repo stays private,
# only one GitHub account can commit to it on Netlify's free plan, so only
# one person edits at a time for now. See SVELTIA-SWITCH-CHECKLIST.md in
# 09 - Website for the plan to open that up later.
#
# _data/frame.json is NOT in this file, on purpose. It holds per-page layout
# switches (which header style, which CSS blocks, which icon set load) that
# keep each page's HTML structure correct. It is a studio-only file; editing
# it through the CMS could break a page's layout, so the office never sees
# it here and never needs to.

backend:
  name: github
  repo: 1BIGRED/bc-glass-and-tint-site
  branch: main

site_url: https://bcglassandtint.com
display_url: https://bcglassandtint.com
publish_mode: simple

# Where an uploaded photo is stored.
media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  # ================================================================
  # Business info and review counts (one editable document).
  # ================================================================
  - name: business
    label: "Business Info & Review Counts"
    delete: false
    editor:
      preview: false
    files:
      - name: site
        label: "Business Info & Review Counts"
        file: "_data/site.json"
        description: "The facts that print on every page: name, phone, address, hours, social links and review counts. A change here changes every page at once."
        fields:
          - { label: "Business name", name: name, widget: string }
          - { label: "Business name (page source form)", name: name_html, widget: string, hint: "The same name written the way it has to appear in the page's HTML, with &amp; for the ampersand. Keep it matching Business name above, just with &amp; instead of &." }
          - { label: "Other accepted name", name: alternate_name, widget: string, hint: "A second accepted spelling of the business name, read by search engines." }
          - { label: "Website address", name: url, widget: string, hint: "Technical. Ask the studio before changing." }
          - { label: "Website origin", name: origin, widget: string, hint: "Technical. Ask the studio before changing." }
          - { label: "Logo address", name: logo, widget: string, hint: "Technical. Ask the studio before changing." }
          - { label: "Year founded", name: founding_year, widget: string }
          - { label: "Business description for search engines", name: description, widget: text, hint: "Shown to search engines, not usually seen by customers. Changes every page and the Google listing data. Check with the studio first. May contain a token like {google_count} or {google_rating}; these are filled in automatically from the Review counts and ratings fields below, leave them exactly as they are." }
          - label: "Phone"
            name: phone
            widget: object
            hint: "Changes every page and the Google listing data. Check with the studio first."
            fields:
              - { label: "As printed", name: display, widget: string }
              - { label: "Dialing form (tel: link)", name: tel, widget: string, hint: "Technical format for click-to-call links: a plus sign, the country code, then the digits with no spaces or dashes." }
              - { label: "Search engine form", name: schema, widget: string, hint: "Technical format read by search engines." }
              - { label: "As printed on call buttons", name: display_call, widget: string, hint: "The same number written with the area code in parentheses, for example (702) 550-8840. It must be the same number as As printed above." }
          - { label: "Public email", name: email, widget: string, hint: "Changes every page and the Google listing data. Check with the studio first." }
          - label: "Address"
            name: address
            widget: object
            hint: "Changes every page and the Google listing data. Check with the studio first."
            fields:
              - { label: "Street", name: street, widget: string }
              - { label: "City", name: city, widget: string }
              - { label: "State", name: region, widget: string }
              - { label: "ZIP code", name: postal_code, widget: string }
              - { label: "Country", name: country, widget: string }
              - { label: "One line, as printed", name: display, widget: string }
          - label: "Map position"
            name: geo
            widget: object
            hint: "Changes every page and the Google listing data. Check with the studio first."
            fields:
              - { label: "Latitude", name: latitude, widget: string }
              - { label: "Longitude", name: longitude, widget: string }
          - label: "Hours"
            name: hours
            widget: object
            hint: "Changes every page and the Google listing data. Check with the studio first."
            fields:
              - { label: "As printed", name: display, widget: string }
              - { label: "Search engine form", name: schema, widget: string, hint: "Technical format, for example Tu-Sa 09:00-17:00. Ask the studio before changing." }
              - label: "Open days"
                name: days
                widget: list
                label_singular: "Day"
                summary: "{{fields.value}}"
                field: { label: "Day", name: value, widget: string }
              - { label: "Opens", name: opens, widget: string, hint: "24-hour time, for example 09:00." }
              - { label: "Closes", name: closes, widget: string, hint: "24-hour time, for example 17:00." }
              - { label: "Time zone", name: timezone, widget: string, hint: "Technical. The open and closed message works out the time in this zone. Ask the studio before changing." }
          - label: "Holiday closures (shop closed all day)"
            name: closures
            widget: list
            label_singular: "Closed day"
            required: false
            summary: "{{fields.date}} {{fields.note}}"
            hint: "Add a day the shop is closed. On that date the site says the shop is closed and never promises it opens that day. Add the day only once the shop has confirmed it is closed. Remove the day after it has passed, or leave it; the site ignores past dates. If the same date is also in Holidays with hours not confirmed, the not confirmed list wins and no status shows."
            fields:
              - { label: "Date", name: date, widget: datetime, type: date, picker_utc: true, hint: "Pick the calendar day." }
              - { label: "Note", name: note, widget: string, required: false, hint: "For your own reference, for example Thanksgiving, closed. The site does not print this note on the page." }
          - label: "Holidays with hours not confirmed"
            name: hours_unknown
            widget: list
            label_singular: "Day"
            required: false
            summary: "{{fields.date}} {{fields.note}}"
            hint: "Days when the shop has not confirmed its hours. On these dates the site shows no open or closed message at all, so it never says something wrong. When the shop confirms a day, delete it from this list. If the shop is closed that day, add it to Holiday closures. If the shop is open its normal hours, just delete it."
            fields:
              - { label: "Date", name: date, widget: datetime, type: date, picker_utc: true, hint: "Pick the calendar day." }
              - { label: "Note", name: note, widget: string, required: false, hint: "For your own reference, for example Christmas Eve, hours not confirmed. The site does not print this note on the page." }
          - { label: "Google Maps link", name: maps_url, widget: string, hint: "Changes every page and the Google listing data. Check with the studio first." }
          - { label: "Payment accepted", name: payment_accepted, widget: string, hint: "Plain text list read by search engines, for example Cash, Credit Card, Debit Card." }
          - label: "Areas served (search engines)"
            name: area_served
            widget: list
            label_singular: "Area"
            summary: "{{fields.name}}"
            hint: "Not shown on the page. Read by search engines. Ask the studio before changing."
            fields:
              - { label: "Kind", name: type, widget: string, hint: "Technical: City, Place or AdministrativeArea. Ask the studio before changing." }
              - { label: "Name", name: name, widget: string }
              - { label: "State", name: region, widget: string, required: false }
          - label: "Photos for search engines"
            name: schema_images
            widget: list
            label_singular: "Photo address"
            summary: "{{fields.value}}"
            hint: "Technical image addresses read by search engines. Ask the studio before changing."
            field: { label: "Photo address", name: value, widget: string }
          - label: "Social links"
            name: social
            widget: object
            fields:
              - { label: "Instagram", name: instagram, widget: string, hint: "Only @bc.glassandtint. Never the old @bcglassandtint handle." }
              - { label: "Facebook", name: facebook, widget: string }
              - { label: "Yelp", name: yelp, widget: string }
              - { label: "Tint Wiz", name: tintwiz, widget: string }
              - { label: "Nextdoor", name: nextdoor, widget: string }
              - { label: "TintFinder", name: tintfinder, widget: string }
          - label: "Profiles listed for search engines"
            name: same_as
            widget: list
            label_singular: "Profile address"
            summary: "{{fields.value}}"
            hint: "Every profile address search engines are told belongs to this business. The Instagram entry must stay @bc.glassandtint. Never the old @bcglassandtint handle. Ask the studio before changing or reordering these."
            field: { label: "Profile address", name: value, widget: string }
          - label: "Review counts and ratings"
            name: reviews
            widget: object
            hint: "Re-read the live Google, Yelp and Tint Wiz listings before changing any number here. Every page fills these in automatically."
            fields:
              - { label: "Google rating", name: google_rating, widget: string, hint: "Re-read the live Google listing before changing this. It prints on every page." }
              - { label: "Google review count", name: google_count, widget: string, hint: "Re-read the live Google listing before changing this. It prints on every page." }
              - { label: "Yelp rating", name: yelp_rating, widget: string, hint: "Re-read the live Yelp listing before changing this. It prints on every page." }
              - { label: "Yelp review count", name: yelp_count, widget: string, hint: "Re-read the live Yelp listing before changing this. It prints on every page." }
              - { label: "Tint Wiz rating", name: tintwiz_rating, widget: string, hint: "Re-read the live Tint Wiz listing before changing this. It prints on every page." }
              - { label: "Tint Wiz review count", name: tintwiz_count, widget: string, hint: "Re-read the live Tint Wiz listing before changing this. It prints on every page." }
          - { label: "Google Analytics id", name: ga4_id, widget: string, hint: "Do not change." }
          - { label: "Google Ads tag ID", name: google_ads_id, widget: string, hint: "Leave empty unless the studio says so. Format AW- followed by digits. Empty means no Ads tag loads." }
          - { label: "Microsoft Clarity id", name: clarity_id, widget: string, hint: "Do not change." }
          - { label: "Google site verification token", name: google_site_verification, widget: string, hint: "Do not change." }

  # ================================================================
  # Prices and gallery photos (_data/pricing.json, _data/gallery.json).
  # A price reaches the public site only through the rule in lib/pricing.js:
  # status confirmed AND publish on AND not on legal hold. The gallery lists
  # only photos that were checked for faces and personal items.
  # ================================================================
  - name: prices_gallery
    label: "Prices & Gallery Photos"
    delete: false
    editor:
      preview: false
    files:
      - name: pricing
        label: "Prices"
        file: "_data/pricing.json"
        description: "Every price the website can show. A price shows on the live site only when Status is Confirmed AND Show on the live site is on. Everything else shows Call for a quote. Draft prices never show on the live site. Never type a guess, a competitor's number, or 0 to mean unknown."
        fields:
          - { label: "Date last updated", name: updated, widget: string, hint: "YYYY-MM-DD format. Change it to today's date whenever you change a price." }
          - { label: "Currency", name: currency, widget: string, hint: "Do not change." }
          - label: "Rules, in plain English (read only, do not edit)"
            name: notes
            widget: list
            label_singular: "Rule"
            summary: "{{fields.value}}"
            hint: "The studio's notes on how this file works. Read them, but do not edit them."
            field: { label: "Rule", name: value, widget: text }
          - { label: "Price gate (studio only)", name: gate, widget: hidden }
          - { label: "Film lines (studio only)", name: film_tiers, widget: hidden }
          - label: "Shades the shop stocks"
            name: shades_installed
            widget: list
            label_singular: "Shade"
            required: false
            summary: "{{fields.value}}"
            hint: "Add a shade (the percent of light the film lets through) only when the owner lists it as stocked. While this list is empty, the Build Your Tint tool shows example shades with a note that the shop confirms what it stocks."
            field: { label: "Shade (percent of light let through)", name: value, widget: number, value_type: int, min: 1, max: 100 }
          - { label: "Example shades (studio only)", name: example_shades, widget: hidden }
          - { label: "Vehicle sizes (studio only)", name: vehicle_classes, widget: hidden }
          - label: "Single-price lines (chip repair, home film, coatings, blinds)"
            name: services
            widget: object
            hint: "One price each. A price shows on the live site only when Status is Confirmed AND Show on the live site is on."
            fields:
              - label: "Windshield chip repair, first chip"
                name: chip_repair_first
                widget: object
                collapsed: true
                summary: "{{fields.status}} {{fields.display}}"
                fields: &service_fields
                  - { label: "Name of this line", name: label, widget: string, hint: "Technical name of the price line. Ask the studio before changing." }
                  - { label: "Unit", name: unit, widget: string, required: false, hint: "What the price is for, for example per square foot. Ask the studio before changing." }
                  - label: "Status"
                    name: status
                    widget: select
                    options:
                      - { label: "Unknown, no number yet", value: unknown }
                      - { label: "Draft, not signed off by the owner", value: draft }
                      - { label: "Confirmed, the owner gave this exact number", value: confirmed }
                    hint: "A price shows on the live site only when status is confirmed AND Show on the live site is on. Pick Confirmed only after the owner has given this exact number."
                  - { label: "Amount (number only)", name: amount, widget: number, value_type: float, min: 0, required: false, hint: "A plain number with no dollar sign, for example 80. Leave empty if unknown. Never type 0 to mean unknown. Never type a guess or a competitor's number." }
                  - { label: "Words the site prints", name: display, widget: string, required: false, hint: "Exactly what customers read, for example $80 or From $350. Fill it in when the status is Confirmed. Keep Starting at wording where the line says it." }
                  - { label: "Show on the live site", name: publish, widget: boolean, default: false, required: false, hint: "A price shows on the live site only when status is confirmed AND Show on the live site is on. Leave this off to keep a confirmed price private; the site then says Call for a quote." }
                  - { label: "Confirmed by", name: confirmed_by, widget: string, required: false, hint: "Who gave the number, by name or role. Required before you set the status to Confirmed." }
                  - { label: "Confirmed on", name: confirmed_on, widget: datetime, type: date, picker_utc: true, required: false, hint: "The day the owner gave the number." }
                  - { label: "Where the number came from", name: source, widget: string, required: false, hint: "Reference only. Do not change." }
                  - { label: "How the number was worked out", name: basis, widget: text, required: false, hint: "Reference only. Do not change." }
              - { label: "Windshield chip repair, each additional chip", name: chip_repair_additional, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *service_fields }
              - { label: "Exterior turf protection film", name: turf_protection_film, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *service_fields }
              - { label: "Home window film, per window", name: home_film_per_window, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *service_fields }
              - { label: "Sliding glass door film", name: sliding_door, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *service_fields }
              - { label: "Office and storefront glass film", name: office_glass, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *service_fields }
              - { label: "Ceramic coating", name: ceramic_coating, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *service_fields }
              - { label: "Clear bra, paint protection film", name: clear_bra, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *service_fields }
              - { label: "Headlight restoration", name: headlight_restoration, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *service_fields }
              - { label: "Blinds and window treatments, from", name: blinds_from, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *service_fields }
          - label: "Auto tint prices"
            name: auto_tint
            widget: object
            hint: "Prices are set per vehicle size: Car, SUV, Pickup and Van. Front doors darker than 35 percent never get a price on the site (Nevada law, NRS 484D.440)."
            fields:
              - label: "Packages (several windows at once)"
                name: coverage
                widget: object
                fields:
                  - label: "Front doors"
                    name: two_front_doors
                    widget: object
                    collapsed: true
                    fields:
                      - { label: "Name of this package", name: label, widget: string, hint: "Technical name. Ask the studio before changing." }
                      - { label: "Windows covered (studio only)", name: panels, widget: hidden }
                      - { label: "Worksheet column (studio only)", name: worksheet_column, widget: hidden }
                      - label: "Car"
                        name: car
                        widget: object
                        collapsed: true
                        summary: "{{fields.status}} {{fields.display}}"
                        fields: &price_fields
                          - label: "Status"
                            name: status
                            widget: select
                            options:
                              - { label: "Unknown, no number yet", value: unknown }
                              - { label: "Draft, not signed off by the owner", value: draft }
                              - { label: "Confirmed, the owner gave this exact number", value: confirmed }
                            hint: "A price shows on the live site only when status is confirmed AND Show on the live site is on. Pick Confirmed only after the owner has given this exact number."
                          - { label: "Amount (number only)", name: amount, widget: number, value_type: float, min: 0, required: false, hint: "A plain number with no dollar sign, for example 150. Leave empty if unknown. Never type 0 to mean unknown. Never type a guess or a competitor's number." }
                          - { label: "Words the site prints", name: display, widget: string, required: false, hint: "Exactly what customers read, for example From $150. Fill it in when the status is Confirmed." }
                          - { label: "Show on the live site", name: publish, widget: boolean, default: false, required: false, hint: "A price shows on the live site only when status is confirmed AND Show on the live site is on. Leave this off to keep a confirmed price private; the site then says Call for a quote." }
                          - { label: "Confirmed by", name: confirmed_by, widget: string, required: false, hint: "Who gave the number, by name or role. Required before you set the status to Confirmed." }
                          - { label: "Confirmed on", name: confirmed_on, widget: datetime, type: date, picker_utc: true, required: false, hint: "The day the owner gave the number." }
                          - { label: "Where the number came from", name: source, widget: string, required: false, hint: "Reference only. Do not change." }
                          - { label: "How the number was worked out", name: basis, widget: text, required: false, hint: "Reference only. Do not change." }
                          - { label: "Why it is unknown", name: why_unknown, widget: string, required: false, hint: "Reference only. Do not change." }
                      - { label: "SUV", name: suv, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "Pickup", name: pickup, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "Van", name: van, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                  - label: "Rear doors and back glass"
                    name: rear_doors_and_back_glass
                    widget: object
                    collapsed: true
                    fields:
                      - { label: "Name of this package", name: label, widget: string, hint: "Technical name. Ask the studio before changing." }
                      - { label: "Windows covered (studio only)", name: panels, widget: hidden }
                      - { label: "Worksheet column (studio only)", name: worksheet_column, widget: hidden }
                      - { label: "Car", name: car, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "SUV", name: suv, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "Pickup", name: pickup, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "Van", name: van, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                  - label: "Full vehicle, side and back glass"
                    name: full_vehicle
                    widget: object
                    collapsed: true
                    hint: "Full vehicle means the side and back glass. The windshield and the sunroof are separate lines."
                    fields:
                      - { label: "Name of this package", name: label, widget: string, hint: "Technical name. Ask the studio before changing." }
                      - { label: "Windows covered (studio only)", name: panels, widget: hidden }
                      - { label: "Worksheet column (studio only)", name: worksheet_column, widget: hidden }
                      - { label: "Car", name: car, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "SUV", name: suv, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "Pickup", name: pickup, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "Van", name: van, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
              - label: "Single windows (separate lines)"
                name: panels
                widget: object
                fields:
                  - label: "Front doors"
                    name: front-doors
                    widget: object
                    collapsed: true
                    fields:
                      - { label: "Name of this line", name: label, widget: string, hint: "Technical name. Ask the studio before changing." }
                      - { label: "Car", name: car, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "SUV", name: suv, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "Pickup", name: pickup, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "Van", name: van, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                  - label: "Rear doors"
                    name: rear-doors
                    widget: object
                    collapsed: true
                    fields:
                      - { label: "Name of this line", name: label, widget: string, hint: "Technical name. Ask the studio before changing." }
                      - { label: "Car", name: car, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "SUV", name: suv, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "Pickup", name: pickup, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "Van", name: van, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                  - label: "Back glass"
                    name: back-glass
                    widget: object
                    collapsed: true
                    fields:
                      - { label: "Name of this line", name: label, widget: string, hint: "Technical name. Ask the studio before changing." }
                      - { label: "Car", name: car, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "SUV", name: suv, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "Pickup", name: pickup, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "Van", name: van, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                  - label: "Windshield top strip"
                    name: windshield-strip
                    widget: object
                    collapsed: true
                    hint: "Nevada allows windshield tint on the top strip only. NRS 484D.440."
                    fields:
                      - { label: "Name of this line", name: label, widget: string, hint: "Technical name. Ask the studio before changing." }
                      - { label: "Car", name: car, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "SUV", name: suv, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "Pickup", name: pickup, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "Van", name: van, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                  - label: "Sunroof"
                    name: sunroof
                    widget: object
                    collapsed: true
                    fields:
                      - { label: "Name of this line", name: label, widget: string, hint: "Technical name. Ask the studio before changing." }
                      - { label: "Car", name: car, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "SUV", name: suv, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "Pickup", name: pickup, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
                      - { label: "Van", name: van, widget: object, collapsed: true, summary: "{{fields.status}} {{fields.display}}", fields: *price_fields }
              - label: "Full windshield film (ON LEGAL HOLD)"
                name: full_windshield_film
                widget: object
                collapsed: true
                hint: "On legal hold. Do not publish until Chase rules on Nevada law. The site never prints this line, in any mode, whatever is typed here. The hold switch and the live-site switch are hidden on purpose."
                fields:
                  - { label: "Name of this line", name: label, widget: string, hint: "Technical name. Ask the studio before changing." }
                  - label: "Status"
                    name: status
                    widget: select
                    options:
                      - { label: "Unknown, no number yet", value: unknown }
                      - { label: "Draft, not signed off by the owner", value: draft }
                      - { label: "Confirmed, the owner gave this exact number", value: confirmed }
                    hint: "On legal hold. Do not publish until Chase rules on Nevada law. Leave this as Draft."
                  - { label: "Amount (number only)", name: amount, widget: number, value_type: float, min: 0, required: false, hint: "On legal hold. Do not change." }
                  - { label: "Words the site prints", name: display, widget: string, required: false, hint: "On legal hold. Do not change." }
                  - { label: "Where the number came from", name: source, widget: string, required: false, hint: "Reference only. Do not change." }
                  - { label: "How the number was worked out", name: basis, widget: text, required: false, hint: "Reference only. Do not change." }
                  - { label: "Legal hold (studio only)", name: legal_hold, widget: hidden }
                  - { label: "Why it is on hold", name: legal_note, widget: text, required: false, hint: "On legal hold. Do not publish until Chase rules on Nevada law. Reference only; do not change." }
                  - { label: "Confirmed by", name: confirmed_by, widget: string, required: false, hint: "On legal hold. Leave empty." }
                  - { label: "Confirmed on", name: confirmed_on, widget: datetime, type: date, picker_utc: true, required: false, hint: "On legal hold. Leave empty." }
                  - { label: "Show on the live site (studio only)", name: publish, widget: hidden }

      - name: gallery
        label: "Gallery Photos"
        file: "_data/gallery.json"
        description: "The photos on the Gallery page and the homepage. Add a photo only when it shows no faces and no personal items and the customer is OK with it. Never guess a shade."
        fields:
          - { label: "Date last updated", name: updated, widget: string, hint: "YYYY-MM-DD format. Change it to today's date whenever you add or change a photo." }
          - label: "Photos"
            name: items
            widget: list
            label_singular: "Photo"
            summary: "{{fields.title}}"
            fields:
              - { label: "Photo id", name: id, widget: string, hint: "Short name written with dashes and no spaces, for example ford-f-150-side. Make it different from every other photo. Do not change it after the photo is live." }
              - { label: "Kind of entry", name: collection, widget: string, default: "job", hint: "Technical. Leave as job unless the studio says otherwise." }
              - label: "Service"
                name: service
                widget: select
                options:
                  - { label: "Auto tint", value: auto-tint }
                  - { label: "Windshield chip repair", value: chip-repair }
                  - { label: "Home window film", value: home-film }
                  - { label: "Commercial and office window film", value: commercial-film }
              - label: "Vehicle"
                name: vehicle
                widget: object
                required: false
                hint: "Fill in for vehicle photos only. Leave all three empty for a home, office or chip repair photo. Only write a make and model you are sure of from the job record."
                fields:
                  - { label: "Make", name: make, widget: string, required: false }
                  - { label: "Model", name: model, widget: string, required: false, hint: "Leave empty if you do not know the model for sure." }
                  - label: "Body"
                    name: body
                    widget: select
                    required: false
                    options:
                      - { label: "Car", value: car }
                      - { label: "SUV", value: suv }
                      - { label: "Pickup", value: pickup }
                      - { label: "Van", value: van }
              - label: "Windows with film in this photo"
                name: panels
                widget: select
                multiple: true
                required: false
                hint: "Pick every window that has film in the photo. Leave empty for a chip repair photo."
                options:
                  - { label: "Front doors", value: front-doors }
                  - { label: "Rear doors", value: rear-doors }
                  - { label: "Back glass", value: back-glass }
                  - { label: "Windshield top strip", value: windshield-strip }
                  - { label: "Sunroof", value: sunroof }
                  - { label: "Home window", value: home-window }
                  - { label: "Office glass", value: office-glass }
              - { label: "Shade (percent of light let through)", name: shade, widget: number, value_type: int, min: 1, max: 100, required: false, hint: "Light let through, from the job record. Leave empty if unknown. Never guess from the photo." }
              - { label: "Film line", name: film_line, widget: string, required: false, hint: "The film name from the job record. Leave empty if unknown. Never guess." }
              - { label: "City", name: city, widget: string, required: false, hint: "Leave empty unless the customer agreed to the city being shown." }
              - { label: "Title", name: title, widget: string, hint: "Short name shown with the photo, for example Ford F-150." }
              - { label: "Photo description (for screen readers)", name: alt, widget: text, hint: "One plain sentence describing what the photo shows. Do not name the customer." }
              - { label: "Small photo (640 wide)", name: img640, widget: image, media_folder: "/images/gallery", public_folder: "/images/gallery", choose_url: false, hint: "The 640 pixel wide version. By habit the file name ends in -640.jpg." }
              - { label: "Large photo (1280 wide)", name: img1280, widget: image, media_folder: "/images/gallery", public_folder: "/images/gallery", choose_url: false, hint: "The 1280 pixel wide version. By habit the file name ends in -1280.jpg." }
              - { label: "Large photo width in pixels", name: w, widget: number, value_type: int, hint: "Technical. Ask the studio before changing." }
              - { label: "Large photo height in pixels", name: h, widget: number, value_type: int, hint: "Technical. Ask the studio before changing." }
              - { label: "Small photo width in pixels", name: w640, widget: number, value_type: int, hint: "Technical. Ask the studio before changing." }
              - { label: "Small photo height in pixels", name: h640, widget: number, value_type: int, hint: "Technical. Ask the studio before changing." }
              - { label: "Edited master file", name: source_master, widget: string, hint: "Where the full size edited photo is kept in the studio photo library. Ask the studio before changing." }
              - { label: "Checked: no faces, no personal items, customer OK", name: checked, widget: boolean, default: false, hint: "Only on when no faces, no personal items, and the customer is OK with it." }
              - { label: "Note", name: note, widget: text, required: false, hint: "For the office and studio only; not printed on the page. Say how the make and model were identified." }
          - { label: "Shade board (studio only)", name: shade_board, widget: hidden }

