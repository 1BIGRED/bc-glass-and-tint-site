      - name: henderson
        label: "Henderson Page"
        file: "_data/pages/henderson.json"
        description: "Wording may contain small HTML codes or tags, such as &amp; or <a>. Keep them exactly as they are. Windshield replacement is done by a partner shop; chip repair is done here in our own shop. May contain tokens such as {google_count}; leave them exactly as they are."
        fields:
          - label: "Search result listing"
            name: meta
            widget: object
            fields:
              - { label: "Title", name: title, widget: string, hint: "Keep the &amp; entity as it is." }
              - { label: "Description", name: description, widget: text }
              - { label: "Photo description (for screen readers)", name: image_alt, widget: string }
          - label: "Top of page (hero)"
            name: hero
            widget: object
            fields:
              - { label: "Breadcrumb parent label", name: crumb_parent, widget: string }
              - { label: "Breadcrumb current page name", name: crumb, widget: string }
              - { label: "Heading", name: heading, widget: string }
              - { label: "Intro paragraph", name: intro, widget: text }
          - label: "Scrolling trust badges"
            name: band
            widget: list
            label_singular: "Badge"
            summary: "{{fields.value}}"
            field: { label: "Badge", name: value, widget: string }
          - label: "What Henderson Customers Come to Us For section"
            name: content
            widget: object
            hint: "Chip repair is done in our own shop; full windshield replacement is subcontracted to a glass specialist. Never write that we do replacement labor ourselves."
            fields:
              - { label: "Heading", name: heading, widget: string }
              - label: "Bullet points"
                name: bullets
                widget: list
                label_singular: "Bullet"
                summary: "{{fields.value}}"
                field: { label: "Bullet", name: value, widget: text }
              - { label: "Photo description (for screen readers)", name: image_alt, widget: string }
          - label: "Why Henderson Homeowners Tint section"
            name: facts
            widget: object
            hint: "Each fact must keep its own cited source. Never invent, estimate or back-fill a number."
            fields:
              - { label: "Heading", name: heading, widget: string }
              - { label: "Paragraph", name: sub, widget: text }
              - label: "Facts"
                name: items
                widget: list
                label_singular: "Fact"
                summary: "{{fields.term}}"
                fields:
                  - { label: "Statement", name: term, widget: text }
                  - { label: "Detail", name: detail, widget: text }
                  - { label: "Source citation", name: source, widget: string }
          - label: "Areas of Henderson We Work In section"
            name: areas
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
              - label: "Groups"
                name: groups
                widget: list
                label_singular: "Group"
                summary: "{{fields.heading}}"
                fields:
                  - { label: "Heading", name: heading, widget: string }
                  - { label: "Text", name: text, widget: text }
              - { label: "Closing line", name: closing, widget: string }
