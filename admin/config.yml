      - name: privacy_policy
        label: "Privacy Policy Page"
        file: "_data/pages/privacy_policy.json"
        description: "Wording may contain small HTML codes or tags, such as &amp;, <a>, <br>, <strong> or <code>. Keep them exactly as they are; they control how the text displays and links work. This is a legal policy page: check with the studio before changing any sentence, not just the obvious ones."
        fields:
          - label: "Search result listing"
            name: meta
            widget: object
            fields:
              - { label: "Title", name: title, widget: string, hint: "Keep the &amp; entity as it is." }
              - { label: "Description", name: description, widget: text }
              - { label: "Photo description (for screen readers)", name: image_alt, widget: string }
          - label: "Top of page (hero)"
            name: hero
            widget: object
            fields:
              - { label: "Heading", name: heading, widget: string }
          - label: "Updated line"
            name: updated
            widget: object
            fields:
              - { label: "Effective date line", name: effective, widget: string, hint: "Update this whenever the policy changes." }
              - { label: "Previous version note", name: previous_note, widget: string }
          - { label: "Intro paragraph", name: intro, widget: text, hint: "Keep the &amp; entity and quotation marks as they are." }
          - label: "Policy sections"
            name: sections
            widget: list
            label_singular: "Section"
            summary: "{{fields.heading}}"
            hint: "Each section is a heading plus one or more blocks. A block is either a paragraph or a bulleted list; leave Block type exactly as p or ul and fill in only the matching field below it."
            fields:
              - { label: "Heading", name: heading, widget: string }
              - label: "Blocks"
                name: blocks
                widget: list
                label_singular: "Block"
                summary: "{{fields.type}}"
                fields:
                  - { label: "Block type (p or ul, do not change)", name: type, widget: string, hint: "Technical: p for a paragraph (fill in Paragraph text below) or ul for a bulleted list (fill in List items below). Ask the studio before changing this." }
                  - { label: "Paragraph text", name: text, widget: text, required: false, hint: "Only for a p block. Keep any HTML tags or codes, such as &amp;, <a>, <br>, <strong> or <code>, exactly as they are." }
                  - label: "List items"
                    name: items
                    widget: list
                    label_singular: "Item"
                    required: false
                    hint: "Only for a ul block. Keep any HTML tags or codes, such as <strong>, exactly as they are."
                    field: { label: "Item", name: value, widget: text }

